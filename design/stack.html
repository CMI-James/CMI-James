<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="size" content="1200x340">
<script src="theme.js"></script>
<link rel="stylesheet" href="base.css">
<style>
  :root { --w: 1200px; --h: 340px; }
  .inner { padding: 44px 56px; display: grid; grid-template-columns: 200px 1fr; row-gap: 24px; align-content: center; }
  .label { font-size: 16px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; padding-top: 12px; }
  .items { display: flex; flex-wrap: wrap; gap: 12px; }
  .items span { font-size: 24px; padding: 8px 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .items span.hot { border-color: var(--accent-border); background: var(--accent-dim); color: var(--accent); }
</style>
</head>
<body>
<div class="card"><div class="inner">
  <div class="label mono">Languages</div>
  <div class="items"><span class="hot">TypeScript</span><span>JavaScript</span><span>SQL</span><span>Python</span><span>Rust</span></div>
  <div class="label mono">Frameworks</div>
  <div class="items"><span class="hot">Next.js</span><span>React</span><span>Node.js</span><span>NestJS</span><span>Tailwind</span></div>
  <div class="label mono">Data &amp; tools</div>
  <div class="items"><span class="hot">PostgreSQL</span><span>Supabase</span><span>Sanity</span><span>Docker</span><span>Vercel</span></div>
</div></div>
</body>
</html>
