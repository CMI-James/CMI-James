<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="size" content="290x84">
<link rel="stylesheet" href="base.css">
<style>
  :root { --w: 290px; --h: 84px; }
  .card { border-radius: 16px; }
  .card::after { width: 200px; height: 200px; right: -90px; top: -120px; }
  .inner { padding: 0 24px; display: flex; flex-direction: column; justify-content: center; }
  .k { font-size: 12px; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; }
  .v { font-size: 17px; font-weight: 500; margin-top: 4px; }
  .arrow { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 20px; }
</style>
</head>
<body>
<div class="card"><div class="inner">
  <div class="k mono" id="k"></div>
  <div class="v" id="v"></div>
  <div class="arrow">↗</div>
</div></div>
<script>
  // Render with ?c=<key>
  const links = {
    github: ["GitHub", "CMI-James"],
    linkedin: ["LinkedIn", "Chibuikem Ilonze"],
    x: ["X", "@cmi_james"],
    site: ["Portfolio", "cmi-james.vercel.app"],
  };
  const [k, v] = links[new URLSearchParams(location.search).get("c")] || links.github;
  document.getElementById("k").textContent = k;
  document.getElementById("v").textContent = v;
</script>
</body>
</html>
