<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="size" content="1200x420">
<link rel="stylesheet" href="base.css">
<style>
  :root { --w: 1200px; --h: 420px; }
  .inner { padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  h1 { font-size: 64px; line-height: 1.02; font-weight: 700; margin-top: 18px; }
  h1 span { color: var(--accent); }
  .lede { font-size: 22px; line-height: 1.5; color: var(--muted); max-width: 760px; margin-top: 20px; }
  .lede b { color: var(--text); font-weight: 500; }
  .row { display: flex; gap: 10px; }
  .handle { position: absolute; right: 64px; top: 56px; font-size: 15px; color: var(--muted); }
</style>
</head>
<body>
<div class="card"><div class="inner">
  <div>
    <div class="eyebrow">Software engineer · Building on Stellar</div>
    <h1 class="display">Chibuikem Michael<br>Ilonze<span>.</span></h1>
    <p class="lede">I build <b>Soroban smart contracts in Rust</b> and the <b>TypeScript products</b> around them: games, risk infrastructure, payments and cross-chain rails.</p>
  </div>
  <div class="row">
    <span class="tag">Rust · Soroban</span>
    <span class="tag">TypeScript</span>
    <span class="tag">Next.js</span>
    <span class="tag">Open source maintainer</span>
  </div>
  <div class="handle mono">@CMI-James</div>
</div></div>
</body>
</html>
